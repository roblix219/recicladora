<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Ring Scale Grid Accent -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Industrial Recycling Badge -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Base Platform Scale Tray -->
    <path d="M128 350 L384 350 L360 380 L152 380 Z" fill="#1e293b" opacity="0.9" />
    <rect x="236" y="380" width="40" height="30" rx="4" fill="#334155" />
    <rect x="170" y="410" width="172" height="12" rx="6" fill="#0f172a" />

    <!-- Scale Indicator / Weight Pod -->
    <rect x="180" y="300" width="152" height="42" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
    <circle cx="198" cy="321" r="5" fill="#ef4444" />
    <rect x="214" y="310" width="102" height="22" rx="4" fill="#022c22" />
    <!-- Digital weight numbers readout -->
    <text x="265" y="326" font-family="monospace, sans-serif" font-weight="bold" font-size="14" fill="#34d399" text-anchor="middle" letter-spacing="1.5">2,480 KG</text>

    <!-- Prominent Modern Recycling Tri-Arrows -->
    <g transform="translate(256, 190) scale(1.15)">
      <!-- Arrow 1 (Top / Right) -->
      <path d="M-15 -90 L15 -90 C45 -90 75 -65 85 -30 L95 -20 L115 -45 L105 10 L50 -5 L70 -25 C62 -50 40 -70 15 -70 L-15 -70 Z" fill="url(#accent)" />
      
      <!-- Arrow 2 (Right to Bottom / Left) -->
      <path d="M75 10 L60 35 C45 60 20 80 -15 85 L-25 85 L-15 110 L-65 75 L-20 40 L-10 65 C15 60 35 45 45 25 L55 5 Z" fill="#6ee7b7" />

      <!-- Arrow 3 (Left to Top) -->
      <path d="M-60 10 L-75 -15 C-90 -40 -85 -70 -60 -95 L-70 -115 L-20 -95 L-40 -50 L-50 -70 C-65 -50 -70 -30 -60 -10 Z" fill="#a7f3d0" />
      
      <!-- Center Leaf / Eco Spark -->
      <path d="M0 -35 C25 -20 30 15 0 35 C-30 15 -25 -20 0 -35 Z" fill="#ffffff" opacity="0.95" />
    </g>
  </g>
</svg>
